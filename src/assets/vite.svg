<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="vaultGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Rounded Square -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Outer Vault Circle Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#vaultGrad)" stroke-width="24" filter="url(#glow)" />
  <circle cx="256" cy="256" r="112" fill="none" stroke="#334155" stroke-width="8" stroke-dasharray="16 12" />

  <!-- Center Vault Lock / Keyhole & Shield -->
  <path d="M256 160 L320 192 V264 C320 312 288 344 256 360 C224 344 192 312 192 264 V192 Z" fill="url(#vaultGrad)" />
  <circle cx="256" cy="240" r="24" fill="#0f172a" />
  <path d="M248 240 L264 240 L268 290 L244 290 Z" fill="#0f172a" />

  <!-- Vault Tech Bolts -->
  <circle cx="256" cy="116" r="10" fill="url(#accentGrad)" />
  <circle cx="256" cy="396" r="10" fill="url(#accentGrad)" />
  <circle cx="116" cy="256" r="10" fill="url(#accentGrad)" />
  <circle cx="396" cy="256" r="10" fill="url(#accentGrad)" />
</svg>
